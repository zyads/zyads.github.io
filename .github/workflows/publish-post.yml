# Build Log pipeline: a GitHub Issue becomes a post on the live site.
#
#   1. Repo owner opens an issue titled "post: ..." (or labels one "post").
#   2. This workflow renders the issue body into index.html (#log section),
#      commits it back to master as the bot, and re-triggers the Pages deploy.
#   3. The issue gets a comment with the live URL, then it is closed.
#
# The blog is a build artifact; the issue is its paper trail.

name: Publish post from issue

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: publish-post
  cancel-in-progress: false

jobs:
  publish:
    # Owner-only: nobody else's issues can touch the site.
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'post') ||
        (github.event.action == 'opened' && startsWith(github.event.issue.title, 'post:'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Render issue into the page
        env:
          # Passed via env, never interpolated into the script: issue text
          # cannot inject shell or workflow syntax.
          POST_TITLE: ${{ github.event.issue.title }}
          POST_BODY: ${{ github.event.issue.body }}
          POST_URL: ${{ github.event.issue.html_url }}
          POST_ISSUE: ${{ github.event.issue.number }}
        run: python3 .github/scripts/publish_post.py

      - name: Commit as the pipeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "$(printf '%s@%s' '41898282+github-actions[bot]' 'users.noreply.github.com')"
          git add index.html
          git commit -m "log: publish post from issue #${{ github.event.issue.number }}"
          git push origin master

      - name: Redeploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        # Pushes made with GITHUB_TOKEN do not re-trigger push workflows,
        # so dispatch the Pages deploy explicitly.
        run: gh workflow run static.yml --ref master

      - name: Close the loop on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUM" --body "Published: https://zyads.github.io/#log — this issue is now part of the site. Closing; the paper trail stays."
          gh issue close "$NUM" --reason completed
